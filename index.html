<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evaluación Día 1 – Técnico A | MTS</title>
<style>
:root{--blue:#185c9c;--dark:#17324d;--gray:#eef2f5;--line:#d5dde5;--white:#fff;--red:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7f9;color:#172b3a}
header{background:var(--blue);color:white;padding:15px 18px;font-weight:700;letter-spacing:.3px}
main{max-width:720px;margin:auto;padding:20px 14px 40px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 5px 22px #1c39550f;margin-top:14px}
h1{font-size:25px;margin:5px 0 8px}.sub{color:#60717e}.badges{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.badge{background:var(--gray);padding:7px 11px;border-radius:20px;font-size:13px;font-weight:700}
input{width:100%;padding:15px;border:2px solid var(--line);border-radius:11px;font-size:17px;margin-top:6px}
button{border:0;border-radius:11px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e9eef2;color:var(--dark)}.full{width:100%;margin-top:16px}
.topline{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.progress{height:9px;background:#dfe7ed;border-radius:9px;overflow:hidden;margin:9px 0 15px}.bar{height:100%;background:var(--blue)}
.option{display:flex;width:100%;align-items:flex-start;gap:12px;text-align:left;background:white;border:2px solid var(--line);margin:10px 0;padding:13px}.option.selected{border-color:var(--blue);background:#edf5fc}.letter{min-width:32px;height:32px;border-radius:50%;background:var(--gray);display:grid;place-items:center}.selected .letter{background:var(--blue);color:white}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.warn{background:#fff0ee;color:var(--red);padding:11px;border-radius:10px;text-align:center;margin-top:12px}
.score{background:var(--blue);color:white;padding:24px;border-radius:16px;text-align:center;margin:18px 0}.score strong{font-size:48px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--gray);padding:16px;border-radius:12px;text-align:center}.stat b{font-size:25px}
.hidden{display:none}.tiny{font-size:12px;color:#6c7b86;margin-top:12px}
@media(max-width:480px){h1{font-size:22px}.card{padding:17px}.option{font-size:15px}}
</style></head>
<body>
<header>MTS · Área Eléctrica</header>
<main>
<section id="start" class="card">
<div class="tiny" style="font-weight:bold;color:#185c9c">MTS MULTITECNI SERVICIOS S.A.S.</div>
<h1>Evaluación Día 1 – Técnico A</h1><div class="sub">Recepción y levantamiento técnico del bobinado original</div>
<div class="badges"><span class="badge">30 preguntas</span><span class="badge">Calificación sobre 10</span></div>
<label><b>Nombre y apellido del técnico</b></label><input id="name" maxlength="80" placeholder="Ej. Juan Pérez">
<div id="nameErr" class="warn hidden">Ingresa nombre y apellido.</div>
<button class="primary full" onclick="startQuiz()">INICIAR EVALUACIÓN</button>
</section>

<section id="quiz" class="hidden">
<div class="topline"><span id="counter"></span><span id="answered"></span></div><div class="progress"><div id="bar" class="bar"></div></div>
<div class="card"><h1 id="question" style="font-size:20px"></h1><div id="options"></div></div>
<div id="warn" class="warn hidden"></div>
<div class="nav"><button id="prev" class="secondary" onclick="go(-1)">Anterior</button><button id="next" class="primary" onclick="nextOrFinish()">Siguiente</button></div>
</section>

<section id="done" class="card hidden" style="text-align:center">
<h1>Evaluación finalizada</h1><div id="doneName" style="font-size:18px;font-weight:bold"></div>
<div class="score"><div>Calificación</div><strong id="grade"></strong><span style="font-size:22px"> / 10</span></div>
<div class="stats"><div class="stat"><small>Respuestas correctas</small><br><b id="correct"></b></div><div class="stat"><small>Porcentaje</small><br><b id="percent"></b></div></div>
<button class="primary full" onclick="resetQuiz()">REALIZAR NUEVA EVALUACIÓN</button>
</section>
</main>
<script>
const BASE=[{"id": 1, "text": "Al recibir un estator para rebobinado, ¿qué conjunto de datos de placa resulta más relevante registrar para identificar las condiciones eléctricas originales del motor?", "options": [{"id": "q1c", "text": "Potencia, tensión, corriente, frecuencia, RPM, número de fases y clase de aislamiento.", "correct": true}, {"id": "q1d1", "text": "Potencia, tensión, peso, color, diámetro exterior y fabricante.", "correct": false}, {"id": "q1d2", "text": "Corriente, RPM, tipo de rodamiento, diámetro del eje y peso.", "correct": false}, {"id": "q1d3", "text": "Tensión, frecuencia, tamaño de carcasa, rodamientos y tipo de pintura.", "correct": false}]}, {"id": 2, "text": "Un motor indica en su placa 230/460 V – 60 Hz – 3 fases. ¿Qué debe verificar el técnico además de registrar estos valores?", "options": [{"id": "q2c", "text": "La conexión correspondiente a las condiciones originales de operación del devanado.", "correct": true}, {"id": "q2d1", "text": "Únicamente el diámetro exterior del estator.", "correct": false}, {"id": "q2d2", "text": "El color del aislamiento utilizado en las cabezas.", "correct": false}, {"id": "q2d3", "text": "El peso total del bobinado.", "correct": false}]}, {"id": 3, "text": "Si la placa de características se encuentra parcialmente ilegible, ¿qué debería hacer el técnico?", "options": [{"id": "q3c", "text": "Registrar únicamente los datos que puedan verificarse y dejar identificada la información faltante.", "correct": true}, {"id": "q3d1", "text": "Completar los datos faltantes utilizando los de otro motor de igual potencia.", "correct": false}, {"id": "q3d2", "text": "Estimar los valores ilegibles utilizando la apariencia del bobinado.", "correct": false}, {"id": "q3d3", "text": "Utilizar los valores típicos del fabricante.", "correct": false}]}, {"id": 4, "text": "¿Por qué es importante registrar conjuntamente frecuencia y RPM?", "options": [{"id": "q4c", "text": "Porque permiten relacionar la velocidad del motor con su número de polos.", "correct": true}, {"id": "q4d1", "text": "Porque permiten determinar directamente el número de espiras.", "correct": false}, {"id": "q4d2", "text": "Porque determinan directamente el calibre del conductor.", "correct": false}, {"id": "q4d3", "text": "Porque indican el tipo de barniz que debe utilizarse.", "correct": false}]}, {"id": 5, "text": "Durante la inspección inicial del estator, ¿qué condición debería quedar documentada antes de modificar el bobinado?", "options": [{"id": "q5c", "text": "Estado general, zonas quemadas, conexiones visibles y condiciones anormales encontradas.", "correct": true}, {"id": "q5d1", "text": "Únicamente el color exterior del estator.", "correct": false}, {"id": "q5d2", "text": "Solamente las partes que posteriormente serán reemplazadas.", "correct": false}, {"id": "q5d3", "text": "Únicamente las condiciones que el técnico considere reparables.", "correct": false}]}, {"id": 6, "text": "Al realizar el levantamiento de un bobinado, ¿por qué debe registrarse el número total de ranuras?", "options": [{"id": "q6c", "text": "Porque forma parte de la configuración del devanado y permite relacionar su distribución con polos y fases.", "correct": true}, {"id": "q6d1", "text": "Porque permite determinar directamente la corriente nominal.", "correct": false}, {"id": "q6d2", "text": "Porque determina la clase térmica del aislamiento.", "correct": false}, {"id": "q6d3", "text": "Porque permite conocer directamente el número de espiras.", "correct": false}]}, {"id": 7, "text": "Si se registra una bobina con paso 1–10, ¿qué significa?", "options": [{"id": "q7c", "text": "Que los lados de la bobina ocupan las posiciones de ranura 1 y 10.", "correct": true}, {"id": "q7d1", "text": "Que tiene diez espiras.", "correct": false}, {"id": "q7d2", "text": "Que pertenece al grupo número 10.", "correct": false}, {"id": "q7d3", "text": "Que existen diez bobinas en esa fase.", "correct": false}]}, {"id": 8, "text": "¿Qué información describe mejor una bobina original para poder reproducirla posteriormente?", "options": [{"id": "q8c", "text": "Paso, número de espiras, dimensiones y características del conductor.", "correct": true}, {"id": "q8d1", "text": "Color, peso aproximado y ubicación visual.", "correct": false}, {"id": "q8d2", "text": "Resistencia total del motor y temperatura ambiente.", "correct": false}, {"id": "q8d3", "text": "Potencia del motor y diámetro exterior del estator.", "correct": false}]}, {"id": 9, "text": "Al encontrar dos conductores en paralelo por espira, ¿cómo debería registrarse?", "options": [{"id": "q9c", "text": "Número de conductores en paralelo y dimensión/calibre individual de cada conductor.", "correct": true}, {"id": "q9d1", "text": "Como un único conductor de mayor diámetro.", "correct": false}, {"id": "q9d2", "text": "Únicamente como sección total de cobre.", "correct": false}, {"id": "q9d3", "text": "Únicamente como dos conductores, sin necesidad de medirlos.", "correct": false}]}, {"id": 10, "text": "¿Qué instrumento es más apropiado para determinar con precisión el diámetro de un conductor redondo utilizado en el bobinado?", "options": [{"id": "q10c", "text": "Micrómetro.", "correct": true}, {"id": "q10d1", "text": "Calibrador de espesores.", "correct": false}, {"id": "q10d2", "text": "Flexómetro.", "correct": false}, {"id": "q10d3", "text": "Regla metálica.", "correct": false}]}, {"id": 11, "text": "Si se mide un conductor sin retirar o considerar su recubrimiento, ¿qué riesgo existe?", "options": [{"id": "q11c", "text": "Incluir el espesor del aislamiento/esmalte dentro de la dimensión medida.", "correct": true}, {"id": "q11d1", "text": "Obtener siempre una dimensión menor a la del cobre.", "correct": false}, {"id": "q11d2", "text": "Modificar eléctricamente el conductor durante la medición.", "correct": false}, {"id": "q11d3", "text": "Confundir el número de espiras con el calibre.", "correct": false}]}, {"id": 12, "text": "¿Cuál es la forma más confiable de determinar el número de espiras de una bobina original cuando esta se encuentra suficientemente conservada?", "options": [{"id": "q12c", "text": "Contarlas de forma controlada en una bobina representativa y registrar el resultado.", "correct": true}, {"id": "q12d1", "text": "Estimarlo a partir de la potencia del motor.", "correct": false}, {"id": "q12d2", "text": "Dividir el número de ranuras para tres.", "correct": false}, {"id": "q12d3", "text": "Determinarlo únicamente a partir del calibre del conductor.", "correct": false}]}, {"id": 13, "text": "Antes de modificar las conexiones existentes, ¿qué información debería quedar registrada?", "options": [{"id": "q13c", "text": "Principios y finales identificables, uniones entre grupos, terminales de salida y disposición de las conexiones.", "correct": true}, {"id": "q13d1", "text": "Únicamente los terminales que llegan a la bornera.", "correct": false}, {"id": "q13d2", "text": "Solamente el número total de cables visibles.", "correct": false}, {"id": "q13d3", "text": "Únicamente la conexión estrella o delta.", "correct": false}]}, {"id": 14, "text": "¿Cuál es la principal función de elaborar un diagrama del bobinado original?", "options": [{"id": "q14c", "text": "Permitir documentar y posteriormente reproducir correctamente la disposición y conexiones encontradas.", "correct": true}, {"id": "q14d1", "text": "Sustituir la necesidad de registrar espiras y conductor.", "correct": false}, {"id": "q14d2", "text": "Determinar automáticamente la potencia del motor.", "correct": false}, {"id": "q14d3", "text": "Calcular la cantidad de barniz requerida.", "correct": false}]}, {"id": 15, "text": "Si durante el levantamiento una conexión entre grupos no puede identificarse claramente, ¿qué debería hacer el técnico?", "options": [{"id": "q15c", "text": "Mantener la evidencia disponible y verificarla antes de dar el dato por definido.", "correct": true}, {"id": "q15d1", "text": "Utilizar la conexión más común para ese tipo de motor.", "correct": false}, {"id": "q15d2", "text": "Seleccionar la conexión utilizada en el último motor reparado.", "correct": false}, {"id": "q15d3", "text": "Asumir que todos los grupos están conectados de la misma manera.", "correct": false}]}, {"id": 16, "text": "¿Qué ventaja proporciona identificar correctamente los principios y finales del devanado?", "options": [{"id": "q16c", "text": "Permite documentar y reconstruir correctamente la relación entre grupos y terminales.", "correct": true}, {"id": "q16d1", "text": "Permite determinar directamente la clase de aislamiento.", "correct": false}, {"id": "q16d2", "text": "Permite calcular automáticamente el diámetro del conductor.", "correct": false}, {"id": "q16d3", "text": "Permite conocer el peso total de cobre.", "correct": false}]}, {"id": 17, "text": "¿Para qué sirven principalmente las fotografías tomadas durante el levantamiento?", "options": [{"id": "q17c", "text": "Como evidencia complementaria de disposición, identificación y conexiones originales.", "correct": true}, {"id": "q17d1", "text": "Para reemplazar completamente el registro escrito y el diagrama.", "correct": false}, {"id": "q17d2", "text": "Para calcular posteriormente las espiras mediante el tamaño de la fotografía.", "correct": false}, {"id": "q17d3", "text": "Únicamente para registrar la apariencia general del estator.", "correct": false}]}, {"id": 18, "text": "Si una fase se encuentra considerablemente más quemada que las otras, ¿qué criterio debería aplicarse para levantar información?", "options": [{"id": "q18c", "text": "Utilizar las zonas mejor conservadas como evidencia y contrastarlas con el resto de la información disponible.", "correct": true}, {"id": "q18d1", "text": "Copiar directamente todos los datos de una de las otras fases sin verificarlos.", "correct": false}, {"id": "q18d2", "text": "Eliminar la fase dañada porque ya no proporciona información útil.", "correct": false}, {"id": "q18d3", "text": "Utilizar exclusivamente los datos de placa.", "correct": false}]}, {"id": 19, "text": "Se encuentran dos registros diferentes del número de espiras para la misma bobina. ¿Qué debería hacer el técnico?", "options": [{"id": "q19c", "text": "Verificar nuevamente el dato antes de considerarlo definitivo.", "correct": true}, {"id": "q19d1", "text": "Utilizar el valor mayor.", "correct": false}, {"id": "q19d2", "text": "Promediar los dos valores.", "correct": false}, {"id": "q19d3", "text": "Seleccionar el que corresponda al calibre de conductor más grande.", "correct": false}]}, {"id": 20, "text": "¿Cuándo puede considerarse que el levantamiento del bobinado original está suficientemente completo para pasar a la siguiente etapa?", "options": [{"id": "q20c", "text": "Cuando los datos críticos del devanado y sus conexiones están registrados y las inconsistencias relevantes han sido aclaradas.", "correct": true}, {"id": "q20d1", "text": "Cuando se dispone únicamente de fotografías suficientes.", "correct": false}, {"id": "q20d2", "text": "Cuando se conoce placa, número de ranuras y calibre del conductor.", "correct": false}, {"id": "q20d3", "text": "Cuando el técnico reconoce visualmente el tipo general de bobinado.", "correct": false}]}, {"id": 21, "text": "¿Cuál de los siguientes conjuntos contiene al menos ocho datos técnicamente relevantes de placa que conviene levantar?", "options": [{"id": "q21c", "text": "Potencia, tensión, corriente, frecuencia, RPM, fases, clase de aislamiento y fabricante/identificación.", "correct": true}, {"id": "q21d1", "text": "Potencia, tensión, corriente, frecuencia, RPM y fabricante, sin fases ni clase de aislamiento.", "correct": false}, {"id": "q21d2", "text": "Tensión, corriente, frecuencia, fases, factor de servicio y tipo de carcasa, sin RPM ni potencia.", "correct": false}, {"id": "q21d3", "text": "Potencia, RPM, fases, clase de aislamiento, rodamientos y peso, sin tensión ni corriente.", "correct": false}]}, {"id": 22, "text": "Antes de intervenir un estator, ¿qué inspección aporta información técnica más útil sobre el estado del bobinado?", "options": [{"id": "q22c", "text": "Revisar estado general, zonas quemadas, conexiones visibles, deterioro y condiciones anormales, dejando evidencia.", "correct": true}, {"id": "q22d1", "text": "Revisar únicamente la pintura y limpieza exterior.", "correct": false}, {"id": "q22d2", "text": "Revisar únicamente la placa de características.", "correct": false}, {"id": "q22d3", "text": "Revisar únicamente las partes que serán reemplazadas.", "correct": false}]}, {"id": 23, "text": "¿Qué conjunto de datos del bobinado original permite reproducirlo con mayor confiabilidad?", "options": [{"id": "q23c", "text": "Número de ranuras, paso, distribución de bobinas/grupos, espiras, conductores en paralelo, dimensión del conductor y conexiones.", "correct": true}, {"id": "q23d1", "text": "Número de ranuras, paso, espiras y calibre, sin registrar paralelos ni conexiones.", "correct": false}, {"id": "q23d2", "text": "Datos de placa, número de grupos, espiras y conexión externa, sin paso ni conductor.", "correct": false}, {"id": "q23d3", "text": "Paso, distribución, conexiones y fotografías, sin conteo de espiras ni medida del conductor.", "correct": false}]}, {"id": 24, "text": "¿Cuál describe correctamente el paso de una bobina?", "options": [{"id": "q24c", "text": "La relación entre las ranuras ocupadas por los dos lados de una misma bobina; por ejemplo, paso 1–10 ocupa las ranuras 1 y 10.", "correct": true}, {"id": "q24d1", "text": "La cantidad de espiras que forman una bobina.", "correct": false}, {"id": "q24d2", "text": "La cantidad de grupos que conforman una fase.", "correct": false}, {"id": "q24d3", "text": "El calibre del conductor utilizado en la bobina.", "correct": false}]}, {"id": 25, "text": "Para levantar correctamente una bobina con varios conductores en paralelo, ¿qué combinación de datos debe determinarse?", "options": [{"id": "q25c", "text": "Número de espiras, cantidad de conductores en paralelo y dimensión/calibre individual de cada conductor.", "correct": true}, {"id": "q25d1", "text": "Número de espiras y sección total de cobre, sin identificar los conductores en paralelo.", "correct": false}, {"id": "q25d2", "text": "Cantidad de conductores en paralelo y calibre, sin contar el número de espiras.", "correct": false}, {"id": "q25d3", "text": "Número de espiras y calibre de un conductor, sin indicar cuántos van en paralelo.", "correct": false}]}, {"id": 26, "text": "Para conocer la distribución del devanado dentro del estator, ¿qué información resulta más útil?", "options": [{"id": "q26c", "text": "Número de ranuras, ubicación de los lados de bobina, paso, agrupación y relación entre grupos/fases.", "correct": true}, {"id": "q26d1", "text": "Datos de placa y tipo de rodamientos.", "correct": false}, {"id": "q26d2", "text": "Tipo de pintura, peso del motor y fabricante.", "correct": false}, {"id": "q26d3", "text": "Peso del cobre, rodamientos y dimensiones exteriores.", "correct": false}]}, {"id": 27, "text": "¿Qué debe permitir reconstruir un buen diagrama del bobinado original?", "options": [{"id": "q27c", "text": "Disposición de bobinas y grupos, principios/finales, uniones entre grupos y terminales de salida.", "correct": true}, {"id": "q27d1", "text": "Disposición de bobinas y grupos, sin indicar uniones ni terminales.", "correct": false}, {"id": "q27d2", "text": "Terminales de salida y conexión en bornera, sin disposición de grupos.", "correct": false}, {"id": "q27d3", "text": "Principios y finales, sin uniones entre grupos ni terminales de salida.", "correct": false}]}, {"id": 28, "text": "Durante el levantamiento encuentra una conexión entre grupos que no logra identificar con seguridad. ¿Cuál es el criterio técnico más adecuado?", "options": [{"id": "q28c", "text": "Mantener intacta la evidencia, documentarla y verificar la conexión antes de continuar con una intervención que pueda eliminar esa información.", "correct": true}, {"id": "q28d1", "text": "Asumir la conexión más frecuente para motores similares.", "correct": false}, {"id": "q28d2", "text": "Cortar la conexión y reconstruirla posteriormente con fotografías.", "correct": false}, {"id": "q28d3", "text": "Determinar la conexión únicamente con los datos de placa.", "correct": false}]}, {"id": 29, "text": "El bobinado está parcialmente quemado: una zona conserva bobinas y conexiones y otra está severamente deteriorada. ¿Cuál es el mejor criterio?", "options": [{"id": "q29c", "text": "Levantar datos verificables de las zonas conservadas, contrastarlos con la evidencia restante e identificar como no comprobado lo que no pueda verificarse.", "correct": true}, {"id": "q29d1", "text": "Copiar los datos de otra fase sin realizar verificaciones adicionales.", "correct": false}, {"id": "q29d2", "text": "Descartar toda la información del bobinado y usar la de un motor similar.", "correct": false}, {"id": "q29d3", "text": "Inferir todos los datos exclusivamente a partir de la placa.", "correct": false}]}, {"id": 30, "text": "Caso práctico: recibe un estator trifásico quemado, placa legible, conexiones parcialmente visibles y sin información previa. ¿Cuál es la secuencia técnica más sólida antes de autorizar extracción?", "options": [{"id": "q30c", "text": "Registrar placa e identificación → inspeccionar y documentar estado → levantar ranuras, paso, espiras, conductor, distribución y conexiones verificables → elaborar evidencia/diagrama → verificar inconsistencias → autorizar extracción.", "correct": true}, {"id": "q30d1", "text": "Registrar placa → extraer bobinado → contar espiras y medir conductor → levantar ranuras y paso → reconstruir conexiones después.", "correct": false}, {"id": "q30d2", "text": "Inspeccionar visualmente → levantar ranuras y espiras → autorizar extracción → medir conductor y conexiones posteriormente.", "correct": false}, {"id": "q30d3", "text": "Registrar placa → tomar fotografías generales → autorizar extracción → reconstruir los datos técnicos después de retirar el bobinado.", "correct": false}]}];
let qs=[],idx=0,answers={},techName="";
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function startQuiz(){
 const n=document.getElementById('name').value.trim().replace(/\s+/g,' ');
 if(n.length<3||n.split(' ').length<2){document.getElementById('nameErr').classList.remove('hidden');return}
 document.getElementById('nameErr').classList.add('hidden');techName=n;answers={};idx=0;
 qs=BASE.map(q=>({...q,options:shuffle(q.options.map(o=>({...o})))}));
 document.getElementById('start').classList.add('hidden');document.getElementById('done').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();
}
function render(){
 const q=qs[idx], letters=['A','B','C','D']; document.getElementById('counter').textContent=`Pregunta ${idx+1} de ${qs.length}`;
 document.getElementById('answered').textContent=`${Object.keys(answers).length} respondidas`;
 document.getElementById('bar').style.width=`${((idx+1)/qs.length)*100}%`;document.getElementById('question').textContent=q.text;
 const box=document.getElementById('options');box.innerHTML='';
 q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option'+(answers[q.id]===o.id?' selected':'');
 b.innerHTML=`<span class="letter">${letters[i]}</span><span>${escapeHtml(o.text)}</span>`;b.onclick=()=>{answers[q.id]=o.id;document.getElementById('warn').classList.add('hidden');render()};box.appendChild(b)});
 document.getElementById('prev').disabled=idx===0;document.getElementById('prev').style.opacity=idx===0?'.45':'1';
 document.getElementById('next').textContent=idx===qs.length-1?'FINALIZAR':'Siguiente';
}
function go(d){idx=Math.max(0,Math.min(qs.length-1,idx+d));render();window.scrollTo(0,0)}
function nextOrFinish(){if(idx<qs.length-1){go(1);return}finish()}
function finish(){
 const missing=qs.filter(q=>!answers[q.id]);
 if(missing.length){const w=document.getElementById('warn');w.textContent=`Faltan ${missing.length} pregunta${missing.length>1?'s':''} por responder.`;w.classList.remove('hidden');idx=qs.findIndex(q=>q.id===missing[0].id);render();w.classList.remove('hidden');return}
 const c=qs.filter(q=>q.options.find(o=>o.id===answers[q.id])?.correct).length;
 document.getElementById('quiz').classList.add('hidden');document.getElementById('done').classList.remove('hidden');
 document.getElementById('doneName').textContent=techName;document.getElementById('grade').textContent=((c/30)*10).toFixed(2);
 document.getElementById('correct').textContent=`${c}/30`;document.getElementById('percent').textContent=`${((c/30)*100).toFixed(1)}%`;window.scrollTo(0,0);
}
function resetQuiz(){document.getElementById('name').value='';document.getElementById('done').classList.add('hidden');document.getElementById('start').classList.remove('hidden');window.scrollTo(0,0)}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
